; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = board_example

[env:AVR128DB32]
platform = atmelmegaavr
board = AVR128DB32
framework = arduino
build_flags = 
	-Iinclude
	-Iconfig
lib_deps = 
	robtillaart/AS5600@^0.6.7
	sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6
	dfrobot/DFRobot_MLX90614@^1.0.4

[env:board_example]
extends = env:AVR128DB32
build_flags = 
	${env:AVR128DB32.build_flags}
	-DBOARD_CONFIG_HEADER=\"board_example.h\"
	-DBAJACAN_ENABLE_DEBUG_PRINTS=1
board_build.f_cpu = 24000000UL
upload_protocol = custom
upload_command = avrdude -c serialupdi -p avr128db32 -P $UPLOAD_PORT -b 115200 -e -U flash:w:"$SOURCE":a
monitor_speed = 115200
monitor_port = $MONITOR_PORT
lib_deps = 
	robtillaart/AS5600@^0.6.7
	sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6
	dfrobot/DFRobot_MLX90614@^1.0.4

[env:front_node]
extends = env:AVR128DB32
build_unflags =
	-DTWI_MORS_SINGLE
build_flags = 
	${env:AVR128DB32.build_flags}
	-DBOARD_CONFIG_HEADER=\"front_node.h\"
	-DBAJACAN_ENABLE_DEBUG_PRINTS=1
	-DTWI_MORS_BOTH=1
board_build.f_cpu = 24000000UL
upload_protocol = custom
upload_command = avrdude -c serialupdi -p avr128db32 -P $UPLOAD_PORT -b 115200 -e -U flash:w:"$SOURCE":a
monitor_speed = 115200
monitor_port = $MONITOR_PORT
lib_deps = 
	robtillaart/AS5600@^0.6.7
	sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6
	dfrobot/DFRobot_MLX90614@^1.0.4

[env:rear_node]
extends = env:AVR128DB32
build_unflags =
	-DTWI_MORS_SINGLE
build_flags = 
	${env:AVR128DB32.build_flags}
	-DBOARD_CONFIG_HEADER=\"rear_node.h\"
	-DBAJACAN_ENABLE_DEBUG_PRINTS=1
	-DTWI_MORS_BOTH=1
board_build.f_cpu = 24000000UL
upload_protocol = custom
upload_command = avrdude -c serialupdi -p avr128db32 -P $UPLOAD_PORT -b 115200 -e -U flash:w:"$SOURCE":a
monitor_speed = 115200
monitor_port = $MONITOR_PORT
lib_deps = 
	robtillaart/AS5600@^0.6.7
	sparkfun/SparkFun BNO08x Cortex Based IMU@^1.0.6
	dfrobot/DFRobot_MLX90614@^1.0.4
